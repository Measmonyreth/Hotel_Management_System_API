server:
  forward-headers-strategy: framework
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true
        path: /
  error:
    whitelabel:
      enabled: false
spring:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: never
      data-locations: classpath:data.sql
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}   
    
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui
    groups-order: DESC
    disable-swagger-default-url: true
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE   
    org.hibernate.orm.jdbc.bind: TRACE 

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

jwt:
  expiration: 86400000

paypal:
  mode: ${PAYPAL_MODE:sandbox}   # sandbox for dev, but often stays sandbox until you go live

cloudinary:
  folder:
    rooms: hotel/rooms
    avatars: hotel/avatars

app:
  oauth2:
    enabled: false