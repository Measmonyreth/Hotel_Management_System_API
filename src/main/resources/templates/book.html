<body>

<div class="card">
    <h2>Book a Room</h2>

    <label for="roomId">Room ID</label>
    <div class="room-lookup">
        <input type="number" id="roomId" min="1" placeholder="Enter room ID" onchange="loadRoom()">
        <button type="button" onclick="loadRoom()">Check Room</button>
    </div>
    <div id="roomInfo"></div>

    <div class="row">
        <div>
            <label for="checkIn">Check-in</label>
            <input type="date" id="checkIn" onchange="updateSummary()">
        </div>
        <div>
            <label for="checkOut">Check-out</label>
            <input type="date" id="checkOut" onchange="updateSummary()">
        </div>
    </div>

    <div class="row">
        <div>
            <label for="customerId">Customer ID</label>
            <input type="number" id="customerId" min="1" placeholder="Customer ID">
        </div>
        <div>
            <label for="employeeId">Employee ID</label>
            <input type="number" id="employeeId" min="1" placeholder="Employee ID">
        </div>
    </div>

    <label for="bookingType">Booking Type</label>
    <select id="bookingType">
        <option value="ONLINE" selected>Online</option>
        <option value="WALK_IN">Walk-in</option>
        <option value="PHONE">Phone</option>
        <option value="AGENT">Agent</option>
    </select>

    <div id="summary"></div>

    <button class="book-btn" id="bookBtn" onclick="bookRoom()">Continue to PayPal Payment</button>
    <p style="text-align:center; font-size:13px; color:#666; margin-top:10px;">
        The booking is saved only after the PayPal payment succeeds.
    </p>

    <p id="status"></p>
</div>

<script>
    let room = null;

    async function loadRoom() {
        const roomId = document.getElementById("roomId").value;
        const info = document.getElementById("roomInfo");
        if (!roomId || roomId <= 0) return;

        info.style.display = "block";
        info.innerText = "Loading room...";
        room = null;

        try {
            const response = await fetch(`/api/room/getroom/${roomId}`);
            const result = await response.json();

            if (response.ok && result.data) {
                room = result.data;
                const discount = room.discountPrice ? Number(room.discountPrice) : 0;
                info.innerHTML = `
                    <strong>${room.roomName || "Room"} (#${room.roomNumber || roomId})</strong>
                    &mdash; ${room.roomType || ""} &mdash; ${room.statusRoom || ""}<br>
                    <span class="price">$${Number(room.price).toFixed(2)} / night</span>
                    ${discount > 0 ? `<br>Discount: -$${discount.toFixed(2)} / night` : ""}`;
            } else {
                info.innerText = result.message || "Room not found.";
            }
        } catch (error) {
            console.error("Error:", error);
            info.innerText = "Failed to load room.";
        }
        updateSummary();
    }

    function nights() {
        const checkIn = document.getElementById("checkIn").value;
        const checkOut = document.getElementById("checkOut").value;
        if (!checkIn || !checkOut) return 0;
        return Math.round((new Date(checkOut) - new Date(checkIn)) / 86400000);
    }

    function updateSummary() {
        const summary = document.getElementById("summary");
        const n = nights();

        if (!room || n <= 0) {
            summary.style.display = "none";
            return;
        }

        const pricePerNight = Number(room.price);
        const discountPerNight = room.discountPrice ? Number(room.discountPrice) : 0;
        const total = (pricePerNight - discountPerNight) * n;

        summary.style.display = "block";
        summary.innerHTML = `
            ${n} night(s) &times; $${pricePerNight.toFixed(2)}
            ${discountPerNight > 0 ? `(-$${discountPerNight.toFixed(2)} discount/night)` : ""}<br>
            Estimated total: <span class="total">$${total.toFixed(2)}</span><br>
            <small>Final price is confirmed by the server (VIP discounts may apply).</small>`;
    }

    function bookRoom() {
        const roomId = document.getElementById("roomId").value;
        const customerId = document.getElementById("customerId").value;
        const employeeId = document.getElementById("employeeId").value;
        const checkIn = document.getElementById("checkIn").value;
        const checkOut = document.getElementById("checkOut").value;
        const bookingType = document.getElementById("bookingType").value;
        const status = document.getElementById("status");

        if (!roomId || !customerId || !employeeId || !checkIn || !checkOut) {
            status.className = "error";
            status.innerText = "Please fill in all fields!";
            return;
        }
        if (nights() <= 0) {
            status.className = "error";
            status.innerText = "Check-out must be after check-in!";
            return;
        }

        // nothing is saved yet — the booking is created only after
        // the PayPal payment succeeds (see /api/success)
        const params = new URLSearchParams({
            roomId: roomId,
            customerId: customerId,
            employeeId: employeeId,
            checkIn: checkIn,
            checkOut: checkOut,
            bookingType: bookingType
        });
        if (room && nights() > 0) {
            const pricePerNight = Number(room.price);
            const discountPerNight = room.discountPrice ? Number(room.discountPrice) : 0;
            params.set("total", ((pricePerNight - discountPerNight) * nights()).toFixed(2));
        }

        status.className = "info";
        status.innerText = "Redirecting to payment...";
        window.location.href = "/paypal/?" + params.toString();
    }
</script>

</body>
