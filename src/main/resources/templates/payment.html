<div class="card">
    <h2>PayPal Payment</h2>

    <div id="bookingSummary" style="display:none; background:#eaf4fb; border:1px solid #b7d9ee; border-radius:6px; padding:12px; font-size:14px; color:#2c3e50; text-align:left;"></div>

<script>
    const qp = new URLSearchParams(window.location.search);
    // new-booking mode: booking details passed from the booking page,
    // the booking itself is created only after PayPal payment succeeds
    const isNewBooking = qp.has("roomId");

    (function init() {
        const summary = document.getElementById("bookingSummary");

        if (isNewBooking) {

        const bookId = qp.get("bookId");

        document.getElementById("bookId").value = bookId;
        const code = qp.get("code");
        const total = parseFloat(qp.get("total"));
        const remaining = parseFloat(qp.get("remaining"));
        if (isNaN(total)) return;

        const deposit = Math.min(total * 0.30, isNaN(remaining) ? total : remaining);
        summary.style.display = "block";
        summary.innerHTML = `
            <strong>Booking ${code || "#" + bookId}</strong><br>
            Total price: <strong>$${total.toFixed(2)}</strong><br>
            Remaining balance: <strong>$${(isNaN(remaining) ? total : remaining).toFixed(2)}</strong><br>
            30% deposit: <strong>$${deposit.toFixed(2)}</strong>`;
    })();

    async function makePayment() {

                employeeId: qp.get("employeeId"),
                email: qp.get("email"),

                checkOut: qp.get("checkOut"),
                bookingType: qp.get("bookingType") || "ONLINE",
                option: option
            });
        } else {
            const bookId = document.getElementById("bookId").value.trim();
            if (!bookId) {
                status.className = "error";
                status.innerText = "Please enter a valid booking ID!";

            const response = await fetch("/api/payment/pay?" + query.toString(), {
                method: "POST"
            });

                status.innerText = result.error || result.message || "Payment initiation failed.";

            }
        } catch (error) {
            console.error("Error:", error);
            status.className = "error";
            status.innerText = "Payment request failed.";
            payBtn.disabled = false;
        }
    }
