<div class="card">
    <h2>Incomplete Payments</h2>

    <table>
        <thead>
        <tr>
            <th>Booking</th>
            <th>Status</th>
            <th class="amount">Total</th>
            <th class="amount">Paid</th>
            <th class="amount">Remaining</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>

    <p id="status">Loading...</p>

    <div class="links">
        <a href="/paypal/book">Book a room</a>
        <a href="/paypal/">Pay by booking ID</a>
    </div>
</div>

<script>
    function money(v) {
        return v != null ? "$" + Number(v).toFixed(2) : "-";
    }

    function payUrl(p) {
        const params = new URLSearchParams({
            bookId: p.bookId,
            code: p.code || "",
            total: p.totalAmount != null ? p.totalAmount : "",
            remaining: p.remainingAmount != null ? p.remainingAmount : ""
        });
        return "/paypal/?" + params.toString();
    }

    async function load() {
        const rows = document.getElementById("rows");
        const status = document.getElementById("status");

        try {
            const response = await fetch("/api/payment/incomplete");
            const result = await response.json();

            if (!response.ok || !result.data) {
                status.innerText = result.message || "Failed to load payments.";
                return;
            }

            if (result.data.length === 0) {
                status.innerText = "No incomplete payments — everything is paid.";
                return;
            }

            status.innerText = "";
            rows.innerHTML = result.data.map(p => `
                <tr>
                    <td>${p.code || "#" + p.bookId}</td>
                    <td><span class="badge ${p.paymentStatus}">${p.paymentStatus.replace("_", " ")}</span></td>
                    <td class="amount">${money(p.totalAmount)}</td>
                    <td class="amount">${money(p.paidAmount)}</td>
                    <td class="amount"><strong>${money(p.remainingAmount)}</strong></td>
                    <td>
                        <button class="pay-btn" onclick="window.location.href='${payUrl(p)}'">
                            Pay remaining
                        </button>
                    </td>
                </tr>`).join("");
        } catch (error) {
            console.error("Error:", error);
            status.innerText = "Failed to load payments.";
        }
    }

    load();
</script>
